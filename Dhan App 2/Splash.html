<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dhan · Splash</title>

  <style>
    @font-face {
      font-family: "Poppins"; font-style: normal; font-weight: 400;
      font-display: swap;
      src: url("fonts/Poppins-Regular.ttf") format("truetype");
    }
    @font-face {
      font-family: "Poppins"; font-style: normal; font-weight: 600;
      font-display: swap;
      src: url("fonts/Poppins-SemiBold.ttf") format("truetype");
    }
    @font-face {
      font-family: "Poppins"; font-style: normal; font-weight: 700;
      font-display: swap;
      src: url("fonts/Poppins-Bold.ttf") format("truetype");
    }

    :root {
      --dhan-navy: #141C41;
      --ease-spring: cubic-bezier(.2,.9,.3,1.3);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: #FFFFFF;
      font-family: "Poppins", system-ui, sans-serif;
      color: var(--dhan-navy);
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 40px 24px;
    }

    .logo {
      height: 180px;
      width: auto;
      animation: fadeSlideIn 600ms var(--ease-spring) both;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .logo { height: 140px; }
    }
  </style>
</head>
<body>
  <div class="stage" role="img" aria-label="Dhan splash screen">
    <img class="logo" src="assets/dhan-logo.svg" alt="Dhan">
  </div>
</body>
</html>
